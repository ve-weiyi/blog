# ============================================================
# Nacos 配置：dataId=blog-rpc  group=veweiyi.cn  namespace=prod
#
# prod 语义：blog 服务**运行在集群内**，因此中间件一律用集群内服务短名。
# 由 deploy/k8s/app/blog-rpc.yaml 以 -nacos-data-id=blog-rpc 拉取。
# ============================================================
Name: app.rpc
ListenOn: 0.0.0.0:9120
Mode: prod

Log:
  Mode: console
  Encoding: plain

# Prometheus 指标（go-zero 内置 agent）。不配置 Host 不启动监听。
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics

MysqlConf:
  Host: mysql
  Port: "3306"
  Username: blog
  Password: blog-mysql-2026
  Dbname: blog
  Config: charset=utf8mb4&parseTime=True&loc=Local

RedisConf:
  Host: redis
  Port: "6379"
  Password: blog-redis-2026
  DB: 0

RabbitMQConf:
  Host: rabbitmq
  Port: "5672"
  Username: blog
  Password: blog-rabbitmq-2026

EmailConf:
  host: smtp.qq.com
  port: 465
  username: xxx@qq.com
  password: xxx
  nickname: blog
  is_ssl: true

# 短信配置。provider: aliyun | tencent | mock（默认 mock，不实际发送）
# 注意键名是下划线形式 —— 该结构体的 json tag 为 snake_case，PascalCase 映射不上
SmsConf:
  provider: mock
  sign_name: xxx
  # aliyun 需要
  access_key: xxx
  secret_key: xxx
  # tencent 需要
  region: xxx
  sdk_app_id: xxx
  # 模板映射：scene -> 模板号
  templates:
    mobile_login: xxx
    reset_password: xxx
    bind: xxx

# 键名同 SmsConf，须与结构体的 json tag 一致（client_id / client_secret）
AppOAuthConf:
  github:
    client_id: xxx
    client_secret: xxx
    redirect_uri: xxx

# 通知配置。键名须与结构体的 json tag 一致（unsubscribe_secret / site_url）
NotifyConf:
  # 退订令牌签名密钥：少于 32 字节按未配置处理 —— 退订链接不签发、退订接口一律拒绝
  # 生成：openssl rand -base64 48
  # 真实值只放 Nacos 控制台，不要提交到仓库
  unsubscribe_secret: CHANGE_ME_RUN_openssl_rand_base64_48
  # 读者端站点地址，用于拼退订链接（是前端页面域名，不是 API 网关域名）。**必须替换**
  site_url: CHANGE_ME_READER_SITE_ORIGIN
