# ============================================================
# Nacos 配置：dataId=app-api  group=veweiyi.cn  namespace=prod
#
# prod 语义：blog 服务**运行在集群内**，因此中间件一律用集群内服务短名。
# 由 deploy/k8s/app/app-api.yaml 以 -nacos-data-id=app-api 拉取。
# ============================================================
Name: blog-api
Host: 0.0.0.0
Port: 9420
Timeout: 5000
# 健康检查
DevServer:
  Enabled: true
  Port: 6060
  HealthPath: "/ping"
  MetricsPath: "/metrics"
  EnableMetrics: true
# 日志配置
Log:
  Mode: file
  Encoding: json
  Path: runtime/blog-api/log
# 文件上传配置
StorageConfig:
  Provider: minio
  Minio:
    Endpoint: minio:9000
    Bucket: blog
    AccessKey: blog
    SecretKey: blog-minio-2026
    Secure: false
    # 图片对外地址由此域名决定，须与 deploy/k8s/ingress/minio.yaml 的主机名一致
    CDNDomain: https://minio.veweiyi.cn

RedisConf:
  db: 0
  host: redis
  port: "6379"
  password: blog-redis-2026

# 令牌签名密钥，至少 32 字节；部署时注入，不要提交真实值
TokenConf:
  secret: ""
  access_token_ttl: 2h
  refresh_token_ttl: 168h

# etcd 模式（集群内 etcd，未启用认证）
# AppRpcConf:
#   Etcd:
#     Hosts:
#      - "etcd:2379"
#     Key: "blog/app.rpc"
#   NonBlock: true
#   Timeout: 5000

# 直连模式
AppRpcConf:
  Endpoints:
    - blog-rpc:9120
  Timeout: 5000

# ============================================================
# AI 助手
# api_key 由环境变量 AI_API_KEY 注入（go-zero 会展开 ${...}），不要写真实值。
# base_url 指向 Hermes 时，AI_API_KEY 必须是 Hermes 的 API_SERVER_KEY；直连 DeepSeek 时填 DeepSeek 密钥。
# 未配置 base_url 或 api_key 时助手不可用，其他功能不受影响。
# SiteURL 是读者端站点根地址，用于拼 AI 引用链接与通知退订链接。
# ============================================================
AiConf:
  base_url: http://hermes:8080/v1
  api_key: "${AI_API_KEY}"
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 800
  timeout: 2m
  max_history_turns: 6
  max_history_chars: 4000
  max_prompt_chars: 12000
  switch_ttl: 60s
  retrieval:
    top_k: 5
    max_chars_total: 4000
  quota:
    guest_daily: 20
    user_daily: 100
    ip_daily: 200
    max_concurrent: 32
    lease: 5m

site_url: https://app.veweiyi.cn
