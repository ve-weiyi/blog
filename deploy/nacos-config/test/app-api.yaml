# ============================================================
# Nacos 配置：dataId=app-api  group=veweiyi.cn  namespace=test
#
# test 语义：blog 服务**运行在集群外**（本机），中间件在集群里，
# 因此一律走节点的公网 IP + hostPort，不能用集群内短名。
#
# AppRpcConf 指向 127.0.0.1 —— test 下 blog-rpc 同样跑在本机。
# 另：本地连 Nacos 需先把 8848 转发出来（见 test/blog-rpc.yaml 头部）。
# ============================================================
Name: blog-api
Host: 0.0.0.0
Port: 9420
Timeout: 5000
# 健康检查
DevServer:
  Enabled: true
  Port: 6060
  HealthPath: "/ping"
  MetricsPath: "/metrics"
  EnableMetrics: true
# 日志配置
Log:
  Mode: file
  Encoding: json
  Path: runtime/blog-api/log
# 文件上传配置
StorageConfig:
  Provider: minio
  Minio:
    Endpoint: 159.75.154.50:9000
    Bucket: blog
    AccessKey: blog
    SecretKey: blog-minio-2026
    Secure: false
    # 图片对外地址：与 prod 相同，读者浏览器访问的是同一个域名
    CDNDomain: https://minio.veweiyi.cn

RedisConf:
  db: 0
  host: 159.75.154.50
  port: "6379"
  password: blog-redis-2026

# 令牌签名密钥，至少 32 字节；部署时注入，不要提交真实值
TokenConf:
  secret: ""
  access_token_ttl: 2h
  refresh_token_ttl: 168h

# etcd 模式（集群内 etcd，未启用认证；test 下跨主机访问需另开端口，暂未启用）
# AppRpcConf:
#   Etcd:
#     Hosts:
#      - "etcd:2379"
#     Key: "blog/app.rpc"
#   NonBlock: true
#   Timeout: 5000

# 直连模式
AppRpcConf:
  Endpoints:
    - 127.0.0.1:9120
  Timeout: 5000

# ============================================================
# AI 助手
# api_key 由环境变量 AI_API_KEY 注入（go-zero 会展开 ${...}），不要写真实值。
# test 下 app-api 跑在本机：base_url 走端口转发（kubectl -n blog port-forward svc/hermes 18642:8080），
# AI_API_KEY 用 Hermes 的 API_SERVER_KEY。
# 未配置 base_url 或 api_key 时助手不可用，其他功能不受影响。
# SiteURL 是读者端站点根地址，用于拼 AI 引用链接与通知退订链接。
# ============================================================
AiConf:
  base_url: http://127.0.0.1:18642/v1
  api_key: "${AI_API_KEY}"
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 800
  timeout: 2m
  max_history_turns: 6
  max_history_chars: 4000
  max_prompt_chars: 12000
  switch_ttl: 60s
  retrieval:
    top_k: 5
    max_chars_total: 4000
  quota:
    guest_daily: 20
    user_daily: 100
    ip_daily: 200
    max_concurrent: 32
    lease: 5m

site_url: http://localhost:3000
