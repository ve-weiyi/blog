# ============================================================
# Nacos 配置：dataId=blog-rpc  group=veweiyi.cn  namespace=test
#
# test 语义：blog 服务**运行在集群外**（本机），中间件在集群里，
# 因此一律走节点的公网 IP + hostPort，不能用集群内短名。
#
# 前置：中间件清单带 hostPort，故这些端口在节点上监听；
#       安全组**不需要**放行它们（本机到节点走公网，需放行 —— 见 README）。
# 另外本地连 Nacos 需把两个端口都转发出来：
#       kubectl -n blog port-forward svc/nacos 8848:8848 9848:9848
#   8848 用于登录换 token，9848（gRPC）用于拉配置 —— 只转 8848 会连不上，
#   且报错会误导向"配置不存在"。然后以 -nacos-host=127.0.0.1 启动本地服务。
# ============================================================
Name: app.rpc
ListenOn: 0.0.0.0:9120
Mode: dev

Log:
  Mode: console
  Encoding: plain

# Prometheus 指标（go-zero 内置 agent）。不配置 Host 不启动监听。
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics

MysqlConf:
  Host: 159.75.154.50
  Port: "3306"
  Username: blog
  Password: blog-mysql-2026
  Dbname: blog
  Config: charset=utf8mb4&parseTime=True&loc=Local

RedisConf:
  Host: 159.75.154.50
  Port: "6379"
  Password: blog-redis-2026
  DB: 0

RabbitMQConf:
  Host: 159.75.154.50
  Port: "5672"
  Username: blog
  Password: blog-rabbitmq-2026

EmailConf:
  host: smtp.qq.com
  port: 465
  username: xxx@qq.com
  password: xxx
  nickname: blog
  is_ssl: true

# 短信配置。provider: aliyun | tencent | mock（默认 mock，不实际发送）
# 注意键名是下划线形式 —— 该结构体的 json tag 为 snake_case，PascalCase 映射不上
SmsConf:
  provider: mock
  sign_name: xxx
  # aliyun 需要
  access_key: xxx
  secret_key: xxx
  # tencent 需要
  region: xxx
  sdk_app_id: xxx
  # 模板映射：scene -> 模板号
  templates:
    mobile_login: xxx
    reset_password: xxx
    bind: xxx

# 键名同 SmsConf，须与结构体的 json tag 一致（client_id / client_secret）
AppOAuthConf:
  github:
    client_id: xxx
    client_secret: xxx
    redirect_uri: xxx

# 通知配置。键名须与结构体的 json tag 一致（unsubscribe_secret / site_url）
NotifyConf:
  # 退订令牌签名密钥：少于 32 字节按未配置处理 —— 退订链接不签发、退订接口一律拒绝
  # 生成：openssl rand -base64 48
  # 本地联调要验证退订时自行生成一个填进来，不要提交真实值
  unsubscribe_secret: CHANGE_ME_RUN_openssl_rand_base64_48
  # 读者端站点地址，用于拼退订链接（是前端页面域名，不是 API 网关域名）
  site_url: http://localhost:3000
