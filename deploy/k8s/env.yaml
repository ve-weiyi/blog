# blog 命名空间共用的凭据 Secret，汇总 MySQL / Redis / PostgreSQL / RabbitMQ / MinIO / etcd / Nacos 的账号密码
#
# 应用：kubectl apply -f env.yaml（需先创建 blog 命名空间，见 namespace.yaml）
# stringData 为明文，apply 时由 API Server 转为 base64 存入 etcd —— base64 是编码不是加密

apiVersion: v1
kind: Secret
metadata:
  name: blog-env
  namespace: blog

type: Opaque
stringData:
  # MySQL (Nacos 依赖)
  MYSQL_DEFAULT_DATABASE: "blog"
  MYSQL_USER: "blog"
  MYSQL_PASSWORD: "blog-mysql-2026"
  MYSQL_ROOT_PASSWORD: "blog-mysql-2026"

  # Redis
  REDIS_PASSWORD: "blog-redis-2026"

  # PostgreSQL
  POSTGRES_PASSWORD: "blog-postgres-2026"

  # RabbitMQ
  RABBITMQ_USERNAME: "blog"
  RABBITMQ_PASSWORD: "blog-rabbitmq-2026"

  # MinIO
  MINIO_ROOT_USER: "blog"
  MINIO_ROOT_PASSWORD: "blog-minio-2026"

  # etcd
  ETCD_USERNAME: "blog"
  ETCD_PASSWORD: "blog-etcd-2026"
  
  # Nacos
  NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
  NACOS_AUTH_IDENTITY_VALUE: "security"
  NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
  NACOS_MYSQL_URL: "jdbc:mysql://mysql:3306/nacos?charset=utf8mb4&parseTime=True&loc=Local&useSSL=false&allowPublicKeyRetrieval=true"
  NACOS_MYSQL_USERNAME: "root"
  NACOS_MYSQL_PASSWORD: "blog-mysql-2026"
