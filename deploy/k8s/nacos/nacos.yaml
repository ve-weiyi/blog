apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-pvc
  namespace: blog
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: blog
spec:
  clusterIP: None
  selector:
    app: nacos
  ports:
    - name: http-api
      port: 8848
    - name: console
      port: 8080
    - name: client-rpc
      port: 9848
    - name: raft-rpc
      port: 9849
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: blog
spec:
  serviceName: nacos
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.1.1
          ports:
            - name: http-api
              containerPort: 8848
            - name: console
              containerPort: 8080
            - name: client-rpc
              containerPort: 9848
            - name: raft-rpc
              containerPort: 9849
          env:
            - name: MODE
              value: standalone
            - name: PREFER_HOST_MODE
              value: hostname
            # 鉴权
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_IDENTITY_KEY
              valueFrom:
                secretKeyRef:
                  name: blog-env
                  key: NACOS_AUTH_IDENTITY_KEY
            - name: NACOS_AUTH_IDENTITY_VALUE
              valueFrom:
                secretKeyRef:
                  name: blog-env
                  key: NACOS_AUTH_IDENTITY_VALUE
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: blog-env
                  key: NACOS_AUTH_TOKEN
            # MySQL 数据源（库与表须预先创建，见 README）
            - name: SPRING_DATASOURCE_PLATFORM
              value: mysql
            - name: DB_URL_0
              valueFrom:
                secretKeyRef:
                  name: blog-env
                  key: NACOS_MYSQL_URL
            - name: DB_USER_0
              valueFrom:
                secretKeyRef:
                  name: blog-env
                  key: NACOS_MYSQL_USERNAME
            - name: DB_PASSWORD_0
              valueFrom:
                secretKeyRef:
                  name: blog-env
                  key: NACOS_MYSQL_PASSWORD
            # JVM 配置
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 256m
            - name: JVM_XMN
              value: 128m
            - name: JVM_OPTS
              value: -XX:MaxDirectMemorySize=128m -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:+ExplicitGCInvokesConcurrent
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
            - name: logs
              mountPath: /home/nacos/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nacos-pvc
        - name: logs
          emptyDir:
            sizeLimit: 500Mi
