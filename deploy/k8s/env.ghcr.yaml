# ============================================================
# 拉取私有镜像（ghcr.io）所需的凭据 Secret
#
# 替代原 registry/apply.sh：原脚本从环境变量 GHCR_USER / GHCR_TOKEN 取值，
# 本文件把同样的内容声明化。
#
# 【本文件已 gitignore，不入库】——填好的版本不会被提交。
# 使用前把下面两个占位符替换为实际值：
#   <GHCR_USER>   GitHub 用户名
#   <GHCR_TOKEN>  具有 read:packages 权限的 PAT
#
# 应用：kubectl apply -f env.ghcr.yaml
# 该 Secret 须先于 app/ 下的清单创建，否则 Pod 会停在 ImagePullBackOff。
#
# 注意 type 与键名都是硬性约定，不能改：
#   type 必须是 kubernetes.io/dockerconfigjson
#   数据键必须是 .dockerconfigjson（kubelet 按此键名读取）
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: blog
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"<GHCR_USER>","password":"<GHCR_TOKEN>"}}}
