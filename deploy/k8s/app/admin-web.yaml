# ============================================================
# blog-admin-web
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: blog-admin-web
  namespace: blog
spec:
  selector:
    app: blog-admin-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-admin-web
  namespace: blog
  labels:
    app: blog-admin-web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blog-admin-web
  template:
    metadata:
      labels:
        app: blog-admin-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: blog-admin-web
          image: ghcr.io/ve-weiyi/ve-admin-element:latest
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: Asia/Shanghai
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
