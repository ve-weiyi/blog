# ============================================================
# app-api
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: blog
  labels:
    app: app-api
spec:
  replicas: 1 # Pod 副本数
  revisionHistoryLimit: 5 # 保留的历史版本数，用于回滚
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app-api
          image: ghcr.io/ve-weiyi/app-api:latest
          ports:
            - containerPort: 9420
          envFrom:
            - configMapRef:
                name: nacos-config
          env:
            # AI 后端密钥：AiConf.base_url 指向 Hermes 时，这里放 Hermes 的 API_SERVER_KEY；
            # 直连 DeepSeek 时改为 DeepSeek 密钥。Secret 缺失时助手不可用，其他功能不受影响。
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: API_SERVER_KEY
                  optional: true
          command: ["./server"]
          args:
            - "-nacos-host=$(NACOS_HOST)"
            - "-nacos-port=$(NACOS_PORT)"
            - "-nacos-username=$(NACOS_USERNAME)"
            - "-nacos-password=$(NACOS_PASSWORD)"
            - "-nacos-namespace=$(NACOS_NAMESPACE)"
            - "-nacos-group=$(NACOS_GROUP)"
            - "-nacos-data-id=app-api"
          # 就绪探针：Pod 就绪后才接收流量
          readinessProbe:
            tcpSocket:
              port: 9420
            initialDelaySeconds: 5
            periodSeconds: 10
          # 存活探针：探测失败则重启容器
          livenessProbe:
            tcpSocket:
              port: 9420
            initialDelaySeconds: 15
            periodSeconds: 20
          # 资源限制：requests 用于调度，limits 防止资源滥用
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
            - name: timezone
              mountPath: /etc/localtime
      volumes:
        - name: runtime
          emptyDir: {}
        - name: timezone
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
---
apiVersion: v1
kind: Service
metadata:
  name: app-api
  namespace: blog
spec:
  selector:
    app: app-api
  ports:
    - port: 9420
      targetPort: 9420
---
# HPA：根据 CPU 和内存负载自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-api-hpa
  namespace: blog
  labels:
    app: app-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
