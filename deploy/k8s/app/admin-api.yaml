# ============================================================
# admin-api
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: blog
  labels:
    app: admin-api
spec:
  replicas: 1 # Pod 副本数
  revisionHistoryLimit: 5 # 保留的历史版本数，用于回滚
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin-api
          image: ghcr.io/ve-weiyi/admin-api:latest
          ports:
            - containerPort: 9421
          envFrom:
            - configMapRef:
                name: nacos-config
          env:
            # 绕过 protobuf 全局注册冲突：etcd 客户端库与项目自身都有 auth.proto。
            # 该变量不在 protobuf 的兼容性承诺内，属已知技术债（根治办法是重命名 auth.proto）。
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
          command: ["./server"]
          args:
            - "-nacos-host=$(NACOS_HOST)"
            - "-nacos-port=$(NACOS_PORT)"
            - "-nacos-username=$(NACOS_USERNAME)"
            - "-nacos-password=$(NACOS_PASSWORD)"
            - "-nacos-namespace=$(NACOS_NAMESPACE)"
            - "-nacos-group=$(NACOS_GROUP)"
            - "-nacos-data-id=admin-api"
          # 就绪探针：Pod 就绪后才接收流量
          readinessProbe:
            tcpSocket:
              port: 9421
            initialDelaySeconds: 5
            periodSeconds: 10
          # 存活探针：探测失败则重启容器
          livenessProbe:
            tcpSocket:
              port: 9421
            initialDelaySeconds: 15
            periodSeconds: 20
          # 资源限制：requests 用于调度，limits 防止资源滥用
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
            - name: timezone
              mountPath: /etc/localtime
      volumes:
        - name: runtime
          emptyDir: {}
        - name: timezone
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: blog
spec:
  selector:
    app: admin-api
  ports:
    - port: 9421
      targetPort: 9421
---
# HPA：根据 CPU 和内存负载自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-api-hpa
  namespace: blog
  labels:
    app: admin-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
