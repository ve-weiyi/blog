# ============================================================
# admin.veweiyi.cn —— 管理后台
#
#   /admin-api  → admin-api  localhost:9421
#   /           → admin-web  localhost:9521
#
# 注意前缀是 /admin-api（协议里 admin-api 服务的 prefix 为 /admin-api/v1），
# 不是 /api —— 写成 /api 匹配不到后端的实际路由。
#
# 证书路径按实际存放位置调整（宝塔面板通常是 /www/ssl/<域名>_nginx/）。
# ============================================================

server {
    listen 80;
    server_name admin.veweiyi.cn;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.veweiyi.cn;

    ssl_certificate     /etc/nginx/ssl/admin.veweiyi.cn_nginx/admin.veweiyi.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.veweiyi.cn_nginx/admin.veweiyi.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 5m;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_tickets off;

    access_log /var/log/nginx/admin.access.log main;

    # 后台接口（websocket 升级头用于 stomp 长连接）
    location ^~ /admin-api {
        proxy_pass http://localhost:9421;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台站点
    location ^~ / {
        proxy_pass http://localhost:9521;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
