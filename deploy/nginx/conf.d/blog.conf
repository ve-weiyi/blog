# ============================================================
# app.veweiyi.cn —— 博客前台
#
#   /api  → app-api  localhost:9420
#   /     → app-web  localhost:9520
#
# 证书路径按实际存放位置调整（宝塔面板通常是 /www/ssl/<域名>_nginx/）。
# ============================================================

server {
    listen 80;
    server_name app.veweiyi.cn;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.veweiyi.cn;

    ssl_certificate     /etc/nginx/ssl/app.veweiyi.cn_nginx/app.veweiyi.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/app.veweiyi.cn_nginx/app.veweiyi.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 5m;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_tickets off;

    access_log /var/log/nginx/blog.access.log main;

    # 前台接口
    location ^~ /api {
        proxy_pass http://localhost:9420;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前台站点
    location ^~ / {
        proxy_pass http://localhost:9520;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
