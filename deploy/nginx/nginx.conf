# ============================================================
# Nginx 基础配置
#
# 站点配置放在 conf.d/ 下：
#   blog.conf   - app.veweiyi.cn   前台（app-api :9420 / app-web :9520）
#   admin.conf  - admin.veweiyi.cn  后台（admin-api :9421 / admin-web :9521）
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 上传体积上限，与前端镜像内嵌 nginx 的 client_max_body_size 保持一致
    client_max_body_size 20m;

    gzip  on;
    gzip_disable     "msie6";
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  256;
    gzip_types       text/plain text/css application/json application/javascript
                     text/xml application/xml application/xml+rss text/javascript
                     application/vnd.ms-fontobject image/svg+xml image/x-icon;

    # 兼容 HTTP 与 WebSocket（stomp 长连接）两种请求协议
    map $http_upgrade $connection_upgrade {
        default     keep-alive;
        'websocket' upgrade;
    }

    include /etc/nginx/conf.d/*.conf;
}
