services:
  # ============================================================
  # blog-rpc — gRPC 服务（文章 / 用户 / 互动 / 通知 / 配置）
  # ============================================================
  blog-rpc:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        SERVICE_DIR: blog-cloud/rpc/blog
    image: blog-rpc:latest
    container_name: blog-rpc
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    ports:
      - "${APP_RPC_PORT:-9120}:${APP_RPC_PORT:-9120}"
    volumes:
      - ./runtime:/app/runtime
    command: [
      "./server",
      "-nacos-host", "${NACOS_HOST}",
      "-nacos-port", "${NACOS_PORT}",
      "-nacos-username", "${NACOS_USERNAME}",
      "-nacos-password", "${NACOS_PASSWORD}",
      "-nacos-namespace", "${NACOS_NAMESPACE}",
      "-nacos-group", "${NACOS_GROUP}",
      "-nacos-data-id", "blog-rpc"
    ]

  # ============================================================
  # app-api — HTTP 网关（用户端）
  # ============================================================
  app-api:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        SERVICE_DIR: blog-cloud/api/app
    image: app-api:latest
    container_name: app-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    ports:
      - "${APP_API_PORT:-9420}:${APP_API_PORT:-9420}"
    volumes:
      - ./runtime:/app/runtime
    command: [
      "./server",
      "-nacos-host", "${NACOS_HOST}",
      "-nacos-port", "${NACOS_PORT}",
      "-nacos-username", "${NACOS_USERNAME}",
      "-nacos-password", "${NACOS_PASSWORD}",
      "-nacos-namespace", "${NACOS_NAMESPACE}",
      "-nacos-group", "${NACOS_GROUP}",
      "-nacos-data-id", "app-api"
    ]

  # ============================================================
  # admin-api — HTTP 网关（管理后台）
  # ============================================================
  admin-api:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        SERVICE_DIR: blog-cloud/api/admin
    image: admin-api:latest
    container_name: admin-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    ports:
      - "${ADMIN_API_PORT:-9421}:${ADMIN_API_PORT:-9421}"
    volumes:
      - ./runtime:/app/runtime
    command: [
      "./server",
      "-nacos-host", "${NACOS_HOST}",
      "-nacos-port", "${NACOS_PORT}",
      "-nacos-username", "${NACOS_USERNAME}",
      "-nacos-password", "${NACOS_PASSWORD}",
      "-nacos-namespace", "${NACOS_NAMESPACE}",
      "-nacos-group", "${NACOS_GROUP}",
      "-nacos-data-id", "admin-api"
    ]

  # ============================================================
  # app-web — 用户端前端（Vue 3 SPA）
  # ============================================================
  app-web:
    build:
      context: ../../blog-app
      dockerfile: ../deploy/docker/frontend/Dockerfile
      args:
        DIST_DIR: dist/blog
        PROXY_PASS: app.veweiyi.cn
    image: app-web:latest
    container_name: app-web
    restart: unless-stopped
    ports:
      - "${APP_WEB_PORT:-9520}:80"

  # ============================================================
  # admin-web — 管理后台前端（Vue 3 SPA）
  # ============================================================
  admin-web:
    build:
      context: ../../blog-admin
      dockerfile: ../deploy/docker/frontend/Dockerfile
      args:
        DIST_DIR: dist/admin
        PROXY_PASS: admin.veweiyi.cn
    image: admin-web:latest
    container_name: admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-9521}:80"

# 应用与依赖服务共用 blog-net（由 deploy/docker/up.sh 创建），
# 这样应用才能经短名访问中间件。详见 deploy/docker-compose/mysql/mysql.yaml 末尾。
networks:
  default:
    name: blog-net
    external: true
