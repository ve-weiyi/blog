volumes:
  redis:

services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-server
    restart: always
    ports:
      - '6379:6379'
    # 官方 redis 镜像不识别 REDIS_PASSWORD 环境变量（那是 bitnami 镜像的特性），
    # 密码只能通过 --requirepass 传入。改动此处需同步改各服务配置的 RedisConf.Password。
    command:
      - redis-server
      - --requirepass
      - blog-redis-2026
    volumes:
      - redis:/data

# 见 mysql/mysql.yaml 末尾说明：依赖与应用共用 blog-net。
networks:
  default:
    name: blog-net
    external: true
