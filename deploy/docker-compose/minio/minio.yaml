volumes:
  minio:

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-server
    restart: always
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # 控制台
    environment:
      MINIO_ROOT_USER: 'blog'
      MINIO_ROOT_PASSWORD: 'blog-minio-2026'
    volumes:
      - minio:/data
    command:
      - server
      - /data
      - --console-address
      - ':9001'

# 见 mysql/mysql.yaml 末尾说明：依赖与应用共用 blog-net。
networks:
  default:
    name: blog-net
    external: true
