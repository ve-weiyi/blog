volumes:
  nacos:

services:
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos-derby
    restart: always
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_ENABLE=true  #开启鉴权
    volumes:
      - nacos:/home/nacos
    ports:
      - "8848:8848"
      - "9848:9848"

# 见 mysql/mysql.yaml 末尾说明：依赖与应用共用 blog-net。
# 应用经短名 nacos 连接，`deploy/docker/.env` 的 NACOS_HOST 即为此值。
networks:
  default:
    name: blog-net
    external: true
