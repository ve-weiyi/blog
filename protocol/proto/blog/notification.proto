syntax = "proto3";

package blog.notification.v1;

option go_package = "./notificationrpc";

// ============================================
// 通用消息定义
// ============================================

message ListQuery {
  int64 page = 1;
  int64 page_size = 2;
  repeated string sorts = 3;       // 排序字段（格式：字段名+空格+asc/desc，如 "created_at desc"）
}

message ListResult {
  int64 page = 1;
  int64 page_size = 2;
  int64 total = 3;
}

// ============================================
// 领域实体
// ============================================

// 公告内容：草稿、发布、撤回。正文只存这一份，派生条目只带引用。
message Announcement {
  int64 id = 1;
  string title = 2;
  string content = 3;
  string category = 4;         // system | maintenance | update | remind
  string level = 5;            // info | warning | error
  string target_type = 6;      // all | user_ids
  string target_ids = 7;       // 目标用户列表（JSON 数组）
  string status = 8;           // draft | published | revoked
  int64 published_at = 9;
  string published_by = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

// 收件箱分组：读者端的展示单元。
// group_key 是不透明键，客户端原样回传即可定位整组成员，不解析、不构造。
message NotificationGroup {
  string group_key = 1;            // 不透明键，原样回传用于整组已读 / 整组删除
  string scene = 2;                // 用于图标与本地分类，不用于寻址
  string title = 3;                // 服务端渲染
  string content = 4;              // 服务端渲染
  string link = 5;                 // 跳转地址，客户端只负责打开
  string level = 6;
  int64 actor_count = 7;           // 组内人数；仅未读视图下是未读条数
  string latest_actor_name = 8;
  int64 latest_at = 9;
  bool unread = 10;
}

// 收件箱条目：管理端排障用的条目级视图，含单条已读时间。
message NotificationItem {
  int64 id = 1;
  int64 event_id = 2;
  string recipient_id = 3;
  string scene = 4;
  string actor_id = 5;             // 取自事件，条目本身不存
  string actor_name = 6;
  string object_type = 7;
  int64 object_id = 8;
  string title = 9;
  string content = 10;
  string link = 11;
  int64 read_at = 12;
  int64 created_at = 13;
}

// 外部渠道投递记录：每个条目每个渠道一行，保存最近一次尝试与回执。
message Delivery {
  int64 id = 1;
  int64 notification_id = 2;
  string channel = 3;              // email | sms | push
  string recipient = 4;            // 邮箱 / 手机号 / 设备端点
  string status = 5;               // pending | sent | failed | cancelled
  string template_code = 6;
  string content = 7;
  string provider_msg_id = 8;
  string error_msg = 9;
  int64 attempts = 10;
  int64 next_retry_at = 11;
  int64 sent_at = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
}

// 通知事件：扇出的工作单元与载荷唯一副本。
message NotificationEvent {
  int64 id = 1;
  string scene = 2;
  string actor_id = 3;
  string object_type = 4;
  int64 object_id = 5;
  string audience_type = 6;        // all | user_ids
  string status = 7;               // pending | fanning | done | failed | terminated
  int64 audience_total = 8;        // 受众总数，扇出开始时确定，作为进度分母
  int64 cursor = 9;                // 已处理到的收件人标识
  int64 created_at = 10;
  int64 updated_at = 11;
}

// 偏好开关：分组 × 渠道。没有记录时取场景默认。
// mandatory 由场景目录决定，只用于回显；更新时传了也会被忽略，否则「安全通知不可退订」可以被客户端绕过。
message NotificationPreference {
  string group = 1;
  string channel = 2;
  bool enabled = 3;
  bool mandatory = 4;
}

// ============================================
// 公告
// ============================================

message ListAnnouncementsRequest {
  ListQuery list_query = 1;
  optional string category = 2;
  optional string level = 3;
  optional string status = 4;
  optional string target_type = 5;
}

message ListAnnouncementsResponse {
  ListResult list_result = 1;
  repeated Announcement list = 2;
}

message GetAnnouncementRequest {
  int64 id = 1;
}

message GetAnnouncementResponse {
  Announcement announcement = 1;
}

message CreateAnnouncementRequest {
  string title = 1;
  string content = 2;
  string category = 3;
  string level = 4;
  string target_type = 5;
  string target_ids = 6;
}

message CreateAnnouncementResponse {
  int64 id = 1;
  Announcement announcement = 2;   // 写入后的实体
}

message UpdateAnnouncementRequest {
  int64 id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  string level = 5;
  string target_type = 6;
  string target_ids = 7;
}

message UpdateAnnouncementResponse {
  bool success = 1;
  Announcement announcement = 2;   // 写入后的实体
}

message BatchDeleteAnnouncementsRequest {
  repeated int64 ids = 1;
}

message BatchDeleteAnnouncementsResponse {
  int64 success_count = 1;
}

message PublishAnnouncementRequest {
  int64 id = 1;
}

message PublishAnnouncementResponse {
  bool success = 1;
  Announcement announcement = 2;   // 发布后的实体
}

message RevokeAnnouncementRequest {
  int64 id = 1;
}

message RevokeAnnouncementResponse {
  bool success = 1;
  Announcement announcement = 2;   // 撤回后的实体
}

// ============================================
// 通知事件（管理端）
// ============================================

// 分页查询事件与扇出进度
message ListNotificationEventsRequest {
  ListQuery list_query = 1;
  optional string status = 2;
  optional string scene = 3;
}

message ListNotificationEventsResponse {
  ListResult list_result = 1;
  repeated NotificationEvent list = 2;
}

// 查询停滞的事件：停在扇出中超过阈值，或已失败。
// 发布与投递之间中断（进程在两步之间退出）不会自动恢复，也不报错，这是它的排查入口。
message ListStalledEventsRequest {
  int64 before_seconds = 1;    // 只看更新时间早于 now - before_seconds 的事件，避开仍在扇出中的
  int64 limit = 2;             // 单次返回上限
}

message ListStalledEventsResponse {
  repeated NotificationEvent list = 1;
}

// 重新扇出。只接受失败或停滞的事件：已完成事件重放会让扇出期间新注册的用户收到旧通知，直接拒绝。
message RedeliverEventRequest {
  int64 id = 1;
}

message RedeliverEventResponse {
  bool success = 1;
}

// ============================================
// 投递记录（管理端）
// ============================================

message ListDeliveriesRequest {
  ListQuery list_query = 1;
  optional string channel = 2;
  optional string status = 3;
  optional string recipient = 4;      // 按收件地址反查
  optional int64 notification_id = 5; // 按条目反查：管理端从收件箱条目点进去看投递结果
}

message ListDeliveriesResponse {
  ListResult list_result = 1;
  repeated Delivery list = 2;
}

message BatchDeleteDeliveriesRequest {
  repeated int64 ids = 1;
}

message BatchDeleteDeliveriesResponse {
  int64 success_count = 1;
}

// 按投递记录重发。幂等：已发送的记录不会被再发一次。
message RedeliverDeliveryRequest {
  int64 id = 1;
}

message RedeliverDeliveryResponse {
  bool success = 1;
}

// ============================================
// 收件箱（读者端）
// ============================================

message ListNotificationsRequest {
  ListQuery list_query = 1;
  repeated string groups = 2;      // 偏好分组集合；为空表示全部
  optional bool unread_only = 3;
}

message ListNotificationsResponse {
  ListResult list_result = 1;
  repeated NotificationGroup list = 2;
}

// 未读分组数：返回总量与按偏好分组的分别计数，供角标使用。
message CountUnreadNotificationsRequest {
  repeated string groups = 1;      // 为空表示全部
}

message CountUnreadNotificationsResponse {
  int64 total = 1;
  map<string, int64> group_counts = 2;
}

// 标记已读。只能按分组：列表下发的是 group_key，客户端手里没有条目 id。
// 收件人一律取自会话主体。
message MarkNotificationsReadRequest {
  string group_key = 1;
}

message MarkNotificationsReadResponse {
  int64 success_count = 1;
}

message MarkAllNotificationsReadRequest {
}

message MarkAllNotificationsReadResponse {
  int64 success_count = 1;
}

// 删除。只能按分组：列表下发的是 group_key，客户端手里没有条目 id。
// 收件人一律取自会话主体。
message DeleteNotificationsRequest {
  string group_key = 1;
}

message DeleteNotificationsResponse {
  int64 success_count = 1;
}

// ============================================
// 收件箱（管理端，只读）
// ============================================

message ListUserNotificationsRequest {
  ListQuery list_query = 1;
  string user_id = 2;
}

message ListUserNotificationsResponse {
  ListResult list_result = 1;
  repeated NotificationItem list = 2;
}

// ============================================
// 偏好与退订
// ============================================

message GetNotifyPreferencesRequest {
}

message GetNotifyPreferencesResponse {
  repeated NotificationPreference list = 1;
}

message UpdateNotifyPreferencesRequest {
  repeated NotificationPreference list = 1;
}

message UpdateNotifyPreferencesResponse {
  repeated NotificationPreference list = 1;
}

// 校验退订令牌：邮件确认页在用户点击之前调用，只回答「会退订什么」，不改变状态。
message VerifyUnsubscribeRequest {
  string token = 1;
}

message VerifyUnsubscribeResponse {
  string group = 1;
  string channel = 2;
}

// 退订：凭签名令牌，不要求登录。强制分组不签发令牌。
message UnsubscribeRequest {
  string token = 1;
}

message UnsubscribeResponse {
  bool success = 1;
  string group = 2;
  string channel = 3;
}

// ============================================
// 验证码
// ============================================

message SendMobileCodeRequest {
  string mobile = 1;
  string scene = 2;
  string biz_id = 3;
  int64 expire_seconds = 4;
}

// 验证码不产生通知记录，因此不回传任何标识
message SendMobileCodeResponse {
}

message VerifyMobileCodeRequest {
  string mobile = 1;
  string scene = 2;
  string code = 3;
  string biz_id = 4;
}

message VerifyMobileCodeResponse {
  bool success = 1;
  string message = 2;
}

message SendEmailCodeRequest {
  string email = 1;
  string scene = 2;
  string biz_id = 3;
  int64 expire_seconds = 4;
}

message SendEmailCodeResponse {
}

message VerifyEmailCodeRequest {
  string email = 1;
  string scene = 2;
  string code = 3;
  string biz_id = 4;
}

message VerifyEmailCodeResponse {
  bool success = 1;
  string message = 2;
}

// ============================================
// 服务定义
// ============================================

service NotificationService {
  // ==================== 公告 ====================

  // 分页查询公告列表
  rpc ListAnnouncements(ListAnnouncementsRequest) returns (ListAnnouncementsResponse);
  // 查询公告详情
  rpc GetAnnouncement(GetAnnouncementRequest) returns (GetAnnouncementResponse);
  // 创建公告
  rpc CreateAnnouncement(CreateAnnouncementRequest) returns (CreateAnnouncementResponse);
  // 更新公告
  rpc UpdateAnnouncement(UpdateAnnouncementRequest) returns (UpdateAnnouncementResponse);
  // 批量删除公告（连同派生条目与投递记录）
  rpc BatchDeleteAnnouncements(BatchDeleteAnnouncementsRequest) returns (BatchDeleteAnnouncementsResponse);
  // 发布公告
  rpc PublishAnnouncement(PublishAnnouncementRequest) returns (PublishAnnouncementResponse);
  // 撤回公告
  rpc RevokeAnnouncement(RevokeAnnouncementRequest) returns (RevokeAnnouncementResponse);

  // ==================== 通知事件（管理端） ====================

  // 分页查询通知事件与扇出进度
  rpc ListNotificationEvents(ListNotificationEventsRequest) returns (ListNotificationEventsResponse);
  // 查询停滞的通知事件
  rpc ListStalledEvents(ListStalledEventsRequest) returns (ListStalledEventsResponse);
  // 重新扇出事件
  rpc RedeliverEvent(RedeliverEventRequest) returns (RedeliverEventResponse);

  // ==================== 投递记录（管理端） ====================

  // 分页查询外部渠道投递记录
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  // 批量删除投递记录
  rpc BatchDeleteDeliveries(BatchDeleteDeliveriesRequest) returns (BatchDeleteDeliveriesResponse);
  // 按投递记录重发
  rpc RedeliverDelivery(RedeliverDeliveryRequest) returns (RedeliverDeliveryResponse);

  // ==================== 收件箱（读者端） ====================

  // 分页查询收件箱（按分组）
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  // 查询未读分组数
  rpc CountUnreadNotifications(CountUnreadNotificationsRequest) returns (CountUnreadNotificationsResponse);
  // 标记通知已读
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse);
  // 全部标记已读
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse);
  // 删除通知
  rpc DeleteNotifications(DeleteNotificationsRequest) returns (DeleteNotificationsResponse);

  // ==================== 收件箱（管理端，只读） ====================

  // 按用户查询收件箱条目
  rpc ListUserNotifications(ListUserNotificationsRequest) returns (ListUserNotificationsResponse);

  // ==================== 偏好与退订 ====================

  // 查询通知偏好
  rpc GetNotifyPreferences(GetNotifyPreferencesRequest) returns (GetNotifyPreferencesResponse);
  // 更新通知偏好
  rpc UpdateNotifyPreferences(UpdateNotifyPreferencesRequest) returns (UpdateNotifyPreferencesResponse);
  // 校验退订令牌
  rpc VerifyUnsubscribe(VerifyUnsubscribeRequest) returns (VerifyUnsubscribeResponse);
  // 凭令牌执行退订
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);

  // ==================== 验证码 ====================

  // 发送手机验证码
  rpc SendMobileCode(SendMobileCodeRequest) returns (SendMobileCodeResponse);
  // 校验手机验证码
  rpc VerifyMobileCode(VerifyMobileCodeRequest) returns (VerifyMobileCodeResponse);
  // 发送邮箱验证码
  rpc SendEmailCode(SendEmailCodeRequest) returns (SendEmailCodeResponse);
  // 校验邮箱验证码
  rpc VerifyEmailCode(VerifyEmailCodeRequest) returns (VerifyEmailCodeResponse);
}
