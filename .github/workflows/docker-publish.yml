name: Docker Build and Publish

# 两种触发方式：
#   push tag          —— 打 tag 即构建全部 5 个镜像，镜像标签为 tag 名 + latest，只构建不部署
#                        git tag v5.0.1 && git push origin v5.0.1
#   workflow_dispatch —— 按服务选择构建，可选顺带部署到服务器
#
# 部署目标（deploy_target，仅 workflow_dispatch 时生效）：
#   docker —— SSH 到服务器执行 docker pull / stop / run（默认，即原有行为）
#   k8s    —— SSH 到 k3s 节点执行 kubectl set image + rollout status
# 各部署形态共用同一套镜像（ghcr.io/ve-weiyi/<service>），切换形态无需重建镜像。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      services:
        description: 'Service to build'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - blog-rpc
          - app-api
          - admin-api
          - app-web
          - admin-web
      deploy_services:
        description: 'Service to deploy'
        type: choice
        required: true
        default: 'skip'
        options:
          - skip
          - all
          - blog-rpc
          - app-api
          - admin-api
          - app-web
          - admin-web
      deploy_target:
        description: 'Deployment target (ignored when deploy_services = skip)'
        type: choice
        required: true
        default: 'docker'
        options:
          - docker
          - k8s

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ve-weiyi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      deploy_matrix: ${{ steps.set-matrix.outputs.deploy_matrix }}

    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          # backend  ：context 为仓库根，靠 service_dir 定位要构建的服务目录
          # frontend ：context 为该前端子模块目录，靠 dist_dir 定位构建产物
          ALL='[
            {"service":"blog-rpc",  "context":".",          "dockerfile":"./deploy/docker/backend/Dockerfile",  "service_dir":"blog-cloud/rpc/blog",  "type":"backend",  "port":"9120"},
            {"service":"app-api",   "context":".",          "dockerfile":"./deploy/docker/backend/Dockerfile",  "service_dir":"blog-cloud/api/app",   "type":"backend",  "port":"9420"},
            {"service":"admin-api", "context":".",          "dockerfile":"./deploy/docker/backend/Dockerfile",  "service_dir":"blog-cloud/api/admin", "type":"backend",  "port":"9421"},
            {"service":"app-web",   "context":"./blog-app", "dockerfile":"./deploy/docker/frontend/Dockerfile", "dist_dir":"dist/blog",  "proxy_pass":"app.veweiyi.cn",  "type":"frontend", "port":"9520"},
            {"service":"admin-web", "context":"./blog-admin","dockerfile":"./deploy/docker/frontend/Dockerfile", "dist_dir":"dist/admin", "proxy_pass":"admin.veweiyi.cn", "type":"frontend", "port":"9521"}
          ]'

          # tag 推送没有 services 输入，固定构建全部服务
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.services }}"
          else
            INPUT="all"
          fi

          if [ "$INPUT" = "all" ]; then
            MATRIX_JSON=$(echo "$ALL" | jq -c '.')
            echo "Build: all 5 services"
          else
            MATRIX_JSON=$(echo "$ALL" | jq -c --arg svc "$INPUT" '[.[] | select(.service == $svc)]')
            echo "Build: ${INPUT}"
          fi
          echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT

          # tag 推送只构建不部署，deploy_matrix 固定为空
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_INPUT="${{ github.event.inputs.deploy_services }}"
          else
            DEPLOY_INPUT="skip"
          fi

          if [ "$DEPLOY_INPUT" = "skip" ]; then
            echo "deploy_matrix=[]" >> $GITHUB_OUTPUT
            echo "Deploy: skipped"
          elif [ "$DEPLOY_INPUT" = "all" ]; then
            echo "deploy_matrix=$(echo "$ALL" | jq -c '.')" >> $GITHUB_OUTPUT
            echo "Deploy: all 5 services"
          else
            echo "deploy_matrix=$(echo "$ALL" | jq -c --arg svc "$DEPLOY_INPUT" '[.[] | select(.service == $svc)]')" >> $GITHUB_OUTPUT
            echo "Deploy: ${DEPLOY_INPUT}"
          fi

  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # CI 里没有 SSH key，子模块走 HTTPS + PAT 拉取
      - name: Setup submodules via HTTPS
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          # 手动触发（默认分支）：main、main-<sha>、latest
          # tag 推送：标签即 tag 名（如 v5.0.1），并同样产出 latest
          # {{branch}} 在 tag 事件下为空串，故 sha 标签限定 branch 事件
          # {{is_default_branch}} 在 tag 事件下恒为 false，故 latest 需显式判断
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_DIR=${{ matrix.service_dir }}
            DIST_DIR=${{ matrix.dist_dir }}
            PROXY_PASS=${{ matrix.proxy_pass }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64

      - name: Generate build summary
        run: |
          echo "## Build Summary - ${{ matrix.service }} :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ matrix.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** \`${{ matrix.type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-docker:
    name: Deploy ${{ matrix.service }} (docker)
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    # 仅手动触发、显式选择了部署服务、且目标为 docker 时才部署；tag 推送只构建
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_services != 'skip' && github.event.inputs.deploy_target == 'docker'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.deploy_matrix) }}

    environment:
      name: production

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICE: ${{ matrix.service }}
          SERVICE_TYPE: ${{ matrix.type }}
          EXPOSE_PORT: ${{ matrix.port }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          NACOS_IP: ${{ vars.NACOS_IP }}
          NACOS_PORT: ${{ vars.NACOS_PORT }}
          NACOS_USERNAME: ${{ vars.NACOS_USERNAME }}
          NACOS_PASSWORD: ${{ vars.NACOS_PASSWORD }}
          NACOS_NAMESPACE: ${{ vars.NACOS_NAMESPACE }}
          NACOS_GROUP: ${{ vars.NACOS_GROUP }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVICE,SERVICE_TYPE,EXPOSE_PORT,REGISTRY,IMAGE_NAMESPACE,NACOS_IP,NACOS_PORT,NACOS_USERNAME,NACOS_PASSWORD,NACOS_NAMESPACE,NACOS_GROUP,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e

            CONTAINER_NAME="${SERVICE}"
            IMAGE_TAG="${REGISTRY}/${IMAGE_NAMESPACE}/${SERVICE}:latest"

            echo "=== Deployment Started ==="
            echo "Service: ${CONTAINER_NAME}"
            echo "Type: ${SERVICE_TYPE}"
            echo "Image: ${IMAGE_TAG}"
            echo "Time: $(date)"

            echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_ACTOR}" --password-stdin

            echo "Pulling new image..."
            docker pull "${IMAGE_TAG}"

            echo "Stopping old container..."
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 前端容器内部固定监听 80；后端监听各自的服务端口
            if [ "${SERVICE_TYPE}" = "frontend" ]; then
              CONTAINER_PORT=80
              APP_ARGS=""
            else
              CONTAINER_PORT="${EXPOSE_PORT}"
              APP_ARGS="./server -nacos-host ${NACOS_IP} -nacos-port ${NACOS_PORT} -nacos-username ${NACOS_USERNAME} -nacos-password ${NACOS_PASSWORD} -nacos-namespace ${NACOS_NAMESPACE} -nacos-group ${NACOS_GROUP} -nacos-data-id ${CONTAINER_NAME}"
            fi

            echo "Starting new container..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${EXPOSE_PORT}:${CONTAINER_PORT}" \
              -v /data/runtime:/app/runtime \
              -v /data/etc:/app/etc \
              -e TZ=Asia/Shanghai \
              "${IMAGE_TAG}" \
              ${APP_ARGS}

            echo "Verifying deployment..."
            sleep 5
            if docker ps | grep -q "${CONTAINER_NAME}"; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Deployment failed!"
              exit 1
            fi

            echo "Cleaning up old images..."
            docker image prune -f

            echo "=== Deployment Completed ==="

      - name: Deployment summary
        if: success()
        run: |
          echo "## Deployment Summary - ${{ matrix.service }} :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ matrix.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Port:** ${{ matrix.port }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Deployed successfully" >> $GITHUB_STEP_SUMMARY

  deploy-k8s:
    name: Deploy ${{ matrix.service }} (k8s)
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    # 与 deploy-docker 互斥：触发条件相同，但目标为 k8s
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_services != 'skip' && github.event.inputs.deploy_target == 'k8s'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.deploy_matrix) }}

    environment:
      name: production

    steps:
      # 经 SSH 在节点上执行 kubectl，而不是把 kubeconfig 存进 GitHub Secret ——
      # k8s-config.yaml 含 system:masters 私钥（集群最高权限），不交给第三方托管。
      # 前置：SSH 用户须为 root（k3s kubectl 读 /etc/rancher/k3s/k3s.yaml，该文件仅 root 可读）。
      - name: Rollout on k3s node via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICE: ${{ matrix.service }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVICE,REGISTRY,IMAGE_NAMESPACE
          script: |
            set -e

            IMAGE_TAG="${REGISTRY}/${IMAGE_NAMESPACE}/${SERVICE}:latest"

            echo "=== Deployment Started ==="
            echo "Service: ${SERVICE}"
            echo "Image: ${IMAGE_TAG}"
            echo "Time: $(date)"

            # Deployment 名与容器名均等于服务名，故 set image 的两侧相同。
            # 镜像由节点经 ghcr-secret 拉取，此处无需 docker login。
            k3s kubectl -n blog set image deployment/"${SERVICE}" "${SERVICE}=${IMAGE_TAG}"

            echo "Waiting for rollout..."
            k3s kubectl -n blog rollout status deployment/"${SERVICE}" --timeout=180s

            echo "=== Deployment Completed ==="

      - name: Deployment summary
        if: success()
        run: |
          echo "## Deployment Summary - ${{ matrix.service }} :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ matrix.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** k3s" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Rolled out successfully" >> $GITHUB_STEP_SUMMARY
